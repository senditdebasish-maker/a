name: PHP quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, json, zip, gd, curl, xml
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint PHP files
        run: find app config database public resources routes scripts -name '*.php' -print0 | xargs -0 -n1 php -l

  database-smoke:
    name: database-smoke (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.0
            image: mysql:8.0
          - name: MariaDB 10.4
            image: mariadb:10.4
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ncp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ncp_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, json, zip, gd, curl, xml
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Import MySQL schema
        run: mysql -h 127.0.0.1 -uroot -proot ncp_test < database/schema.mysql.sql
      - name: Exercise production seeder
        run: php scripts/ci-database-smoke.php
      - name: Configure CI application
        run: |
          cat > .env <<'ENV'
          APP_NAME="CI Pharmacy College"
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8088
          APP_KEY=base64:Q0ktT25seS1UZXN0LUtleS0zMi1CeXRlcy0wMDAwMDA=
          APP_TIMEZONE=Asia/Kolkata
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_CURRENCY=INR
          APP_DATE_FORMAT=d-m-Y
          APP_INSTALLED=true
          DB_DRIVER=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=ncp_test
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_CHARSET=utf8mb4
          SESSION_NAME=ncp_ci_session
          SESSION_LIFETIME=120
          SESSION_SECURE=false
          MAIL_DRIVER=log
          MAIL_FROM_ADDRESS=ci@example.test
          MAIL_FROM_NAME="CI Pharmacy College"
          UPLOAD_MAX_MB=5
          BACKUP_ENCRYPTION=true
          BACKUP_RETENTION_DAYS=30
          REQUIRE_STAFF_MFA=false
          ENV
      - name: Audit admin routes and permissions
        run: php scripts/ci-route-audit.php
      - name: Preflight clean seeded database
        run: php scripts/admissions-preflight.php
      - name: Exercise existing-install admission migration
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE ncp_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h 127.0.0.1 -uroot -proot ncp_upgrade < database/baselines/001_initial_schema.mysql.sql
          DB_DATABASE=ncp_upgrade php scripts/ci-migration-smoke.php seed
          sed -i 's/DB_DATABASE=ncp_test/DB_DATABASE=ncp_upgrade/' .env
          php scripts/admissions-preflight.php
          php scripts/migrate.php --dry-run
          php scripts/migrate.php --confirm=APPLY --backup-confirmed
          php scripts/migrate.php --confirm=APPLY --backup-confirmed | grep 'up to date'
          DB_DATABASE=ncp_upgrade php scripts/ci-migration-smoke.php verify
          php scripts/admissions-preflight.php
          sed -i 's/DB_DATABASE=ncp_upgrade/DB_DATABASE=ncp_test/' .env
      - name: Exercise admission workflow invariants
        run: php scripts/ci-admission-workflow.php
      - name: Exercise public, applicant, staff, CMS and PDF routes
        run: |
          mkdir -p storage/logs storage/cache storage/sessions storage/backups storage/private
          php -S 127.0.0.1:8088 -t public public/index.php > storage/logs/ci-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8088/login >/dev/null; then break; fi
            sleep 1
          done
          if ! smoke_output=$(php scripts/ci-http-smoke.php 2>&1); then
            printf '%s\n' "$smoke_output"
            cat storage/logs/ci-http-server.log
            diagnostic=$(printf '%s' "$smoke_output" | tail -c 1500 | tr '\n' ' ')
            echo "::error title=HTTP smoke failure::$diagnostic"
            exit 1
          fi
          printf '%s\n' "$smoke_output"
